  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 45px;
      background:
        linear-gradient(
          135deg,
          #f4f1ec 0%,
          #faf9f7 50%,
          #eeeae4 100%
        );
      color: #222;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
      letter-spacing: -0.02em;
    }

    .intro {
      max-width: 700px;
      margin-top: 10px;
      color: #666;
      line-height: 1.6;
    }

    h2 {
      margin-top: 45px;
      margin-bottom: 18px;
      font-size: 1.2rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #555;
    }

    /* BOOKSHELF */

    .case-shelf {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 24px;
      padding: 28px 24px 32px;
      margin-top: 10px;

      background:
        linear-gradient(
          to bottom,
          rgba(255,255,255,0.75),
          rgba(255,255,255,0.35)
        );

      border-radius: 12px;
      border: 1px solid #ddd7cf;

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.8),
        0 10px 25px rgba(0,0,0,0.06);
    }

    /* BOOK */

    .case-book {
      position: relative;

      width: 190px;
      min-height: 230px;

      padding: 22px 18px 18px 22px;

      border-radius: 4px 8px 8px 4px;

      background:
        linear-gradient(
          135deg,
          #ffffff 0%,
          #f8f7f5 65%,
          #e8e4df 100%
        );

      border: 1px solid #d3cec7;

      box-shadow:
        5px 7px 12px rgba(0,0,0,0.13),
        inset 3px 0 0 #ddd8d1;

      text-decoration: none;
      color: inherit;

      display: flex;
      flex-direction: column;
      justify-content: space-between;

      overflow: hidden;

      transition:
        transform 0.22s ease,
        box-shadow 0.22s ease;
    }

    /* BOOK SPINE */

    .case-book::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 8px;

      background:
        linear-gradient(
          to right,
          #b9b1a8,
          #e3dfda
        );

      border-right: 1px solid #c8c2bb;
    }

    /* TOP DECORATION */

    .case-book::after {
      content: "";
      position: absolute;
      top: 12px;
      left: 22px;
      right: 18px;
      height: 2px;

      background: #c8c0b7;
    }

    .case-book:hover {
      transform: translateY(-9px) rotate(-1deg);

      box-shadow:
        8px 15px 24px rgba(0,0,0,0.19);
    }

    .case-book-title {
      margin-top: 18px;

      font-family: Georgia, serif;

      font-size: 1.08rem;
      font-weight: 700;
      line-height: 1.4;

      color: #292929;
    }

    .case-book-citation {
      padding-top: 15px;

      font-size: 0.82rem;
      line-height: 1.55;

      color: #666;

      border-top: 1px solid #dedad5;
    }

    .case-book-area {
      margin-top: 12px;

      font-size: 0.68rem;
      font-weight: 700;

      text-transform: uppercase;
      letter-spacing: 0.12em;

      color: #8a8178;
    }

    .case-number {
      display: inline-block;

      margin-bottom: 14px;
      padding: 4px 8px;

      border-radius: 3px;

      background: #ebe7e1;

      font-size: 0.68rem;
      font-weight: bold;

      letter-spacing: 0.08em;
      text-transform: uppercase;

      color: #756d64;
    }

    /* SHELF EDGE */

    .shelf-edge {
      width: 100%;
      height: 12px;

      margin-top: 2px;

      border-radius: 3px;

      background:
        linear-gradient(
          to bottom,
          #d4cec6,
          #aaa198
        );

      box-shadow:
        0 5px 8px rgba(0,0,0,0.16);
    }

    @media (max-width: 600px) {

      body {
        padding: 25px;
      }

      .case-shelf {
        justify-content: center;
      }

      .case-book {
        width: 180px;
      }

    }

  </style>

</head>
